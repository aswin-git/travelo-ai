name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  REGISTRY: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/travelo-ai

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: pytest

  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Create GCS bucket for ChromaDB
        run: |
          BUCKET="${PROJECT_ID}-travelo-chroma"
          gsutil mb -l ${REGION} -p ${PROJECT_ID} gs://${BUCKET} 2>/dev/null || echo "Bucket exists"

      - name: Build & push backend
        run: |
          docker build ./backend -t ${REGISTRY}/backend:${{ github.sha }} -t ${REGISTRY}/backend:latest
          docker push --all-tags ${REGISTRY}/backend

      - name: Deploy backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: travelo-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          flags: |
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=1
            --port=8080
            --timeout=300
            --set-env-vars=CHROMA_PERSIST_DIR=/mnt/chroma
            --add-volume=name=chroma-vol,type=cloud-storage,bucket=${{ secrets.GCP_PROJECT_ID }}-travelo-chroma
            --add-volume-mount=volume=chroma-vol,mount-path=/mnt/chroma

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build & push frontend
        run: |
          docker build ./frontend \
            --build-arg VITE_API_URL=${{ needs.deploy-backend.outputs.backend_url }} \
            --build-arg VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            -t ${REGISTRY}/frontend:${{ github.sha }} \
            -t ${REGISTRY}/frontend:latest
          docker push --all-tags ${REGISTRY}/frontend

      - name: Deploy frontend to Cloud Run
        id: deploy-fe
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: travelo-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          flags: |
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --port=8080

      - name: Update backend CORS
        run: |
          FRONTEND_URL=$(gcloud run services describe travelo-frontend --region=${{ env.REGION }} --format='value(status.url)')
          gcloud run services update travelo-backend --region=${{ env.REGION }} --update-env-vars="ALLOWED_ORIGINS=${FRONTEND_URL}"

      - name: Print URLs
        run: |
          echo "✅ Frontend: $(gcloud run services describe travelo-frontend --region=${{ env.REGION }} --format='value(status.url)')"
          echo "✅ Backend: ${{ needs.deploy-backend.outputs.backend_url }}"
